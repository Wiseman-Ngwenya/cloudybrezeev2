<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Orders - CloudyBreeze Admin</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a href="/admin/dashboard.html" class="admin-sidebar-logo">
                <img src="../images/logo.png" alt="CloudyBreeze Logo">
            </a>
            <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
        </div>
        <nav class="admin-nav">
            <ul class="admin-nav-list">
                <li><a href="/admin/dashboard.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dashboard</a></li>
                <li><a href="/admin/products.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Products</a></li>
                <li><a href="/admin/categories.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Categories</a></li>
                <li><a href="/admin/orders.html" class="admin-nav-link active"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>Orders</a></li>
                <li><a href="/admin/analytics.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a></li>
                <li><a href="/admin/settings.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</a></li>
            </ul>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-link" target="_blank"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>View Store</a>
            <button class="admin-nav-link" id="logoutBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <h1 class="admin-page-title">Orders</h1>
            </div>
            <div class="admin-topbar-right">
                <span class="admin-user-name" id="adminUserName">Admin</span>
            </div>
        </header>

        <div class="admin-content">
            <!-- Filters -->
            <div class="admin-card admin-filters">
                <div class="admin-filters-row">
                    <select class="form-select" id="statusFilter" style="width:auto;">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="processing">Processing</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <select class="form-select" id="paymentFilter" style="width:auto;">
                        <option value="">All Payments</option>
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="failed">Failed</option>
                        <option value="refunded">Refunded</option>
                    </select>
                    <input type="text" class="form-input" id="orderSearch" placeholder="Search by order # or email...">
                </div>
            </div>

            <!-- Orders Table -->
            <div class="admin-card">
                <div class="admin-card-body">
                    <div class="admin-table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order #</th>
                                    <th>Customer</th>
                                    <th>Total</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTable">
                                <tr><td colspan="7" class="admin-table-empty">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="admin-card-footer">
                    <div class="admin-pagination" id="ordersPagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="admin-modal" id="orderModal" style="display: none;">
        <div class="admin-modal-overlay"></div>
        <div class="admin-modal-content admin-modal-lg">
            <h3 class="admin-modal-title">Order Details</h3>
            <div id="orderDetailContent"></div>
            <div class="admin-modal-actions">
                <button class="btn btn-outline" id="closeOrderModal">Close</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        (function () {
            'use strict';

            if (!window.CloudyBreezeAdmin || !window.CloudyBreezeAdmin.checkAuth()) {
                window.location.href = '/admin/login.html';
                return;
            }

            var currentPage = 1;
            var statusFilter = '';
            var paymentFilter = '';
            var searchTerm = '';

            document.addEventListener('DOMContentLoaded', function () {
                setAdminUserName();
                loadOrders();
                initFilters();
                initSidebar();
                initLogout();
                initOrderModal();

                // Check for order ID in URL
                var params = new URLSearchParams(window.location.search);
                var orderId = params.get('id');
                if (orderId) viewOrder(orderId);
            });

            function loadOrders() {
                var params = '?page=' + currentPage + '&limit=20';
                if (statusFilter) params += '&status=' + statusFilter;
                if (paymentFilter) params += '&paymentStatus=' + paymentFilter;
                if (searchTerm) params += '&search=' + encodeURIComponent(searchTerm);

                window.CloudyBreezeAdmin.apiGet('/api/orders/admin' + params)
                    .then(function (result) {
                        if (!result.success) return;
                        renderOrders(result.data, result.pagination);
                    })
                    .catch(function (err) { console.error(err); });
            }

            function renderOrders(orders, pagination) {
                var tbody = document.getElementById('ordersTable');
                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="admin-table-empty">No orders found.</td></tr>';
                    document.getElementById('ordersPagination').innerHTML = '';
                    return;
                }

                tbody.innerHTML = orders.map(function (order) {
                    return '<tr>' +
                        '<td><a href="#" class="view-order-link" data-id="' + order.id + '">' + order.order_number + '</a></td>' +
                        '<td>' + order.customer_name + '<br><small class="text-muted">' + order.customer_email + '</small></td>' +
                        '<td>$' + parseFloat(order.total).toFixed(2) + '</td>' +
                        '<td><span class="admin-badge badge-' + order.payment_status + '">' + order.payment_status + '</span></td>' +
                        '<td><span class="admin-badge badge-' + order.status + '">' + order.status + '</span></td>' +
                        '<td>' + formatDate(order.created_at) + '</td>' +
                        '<td><div class="admin-actions">' +
                            '<button class="btn btn-sm btn-outline view-order-btn" data-id="' + order.id + '">View</button>' +
                            '<select class="form-select admin-status-select" data-id="' + order.id + '" style="width:130px;padding:4px 8px;font-size:12px;">' +
                                '<option value="">Update Status</option>' +
                                '<option value="confirmed">Confirm</option>' +
                                '<option value="processing">Processing</option>' +
                                '<option value="shipped">Shipped</option>' +
                                '<option value="delivered">Delivered</option>' +
                                '<option value="cancelled">Cancel</option>' +
                            '</select>' +
                        '</div></td>' +
                    '</tr>';
                }).join('');

                attachRowEvents();
                renderPagination(pagination);
            }

            function attachRowEvents() {
                document.querySelectorAll('.view-order-link, .view-order-btn').forEach(function (el) {
                    el.addEventListener('click', function (e) {
                        e.preventDefault();
                        viewOrder(this.getAttribute('data-id'));
                    });
                });
                document.querySelectorAll('.admin-status-select').forEach(function (select) {
                    select.addEventListener('change', function () {
                        var id = this.getAttribute('data-id');
                        var newStatus = this.value;
                        if (!newStatus) return;
                        updateOrderStatus(id, newStatus);
                    });
                });
            }

            function updateOrderStatus(id, newStatus) {
                window.CloudyBreezeAdmin.apiPut('/api/orders/admin/' + id + '/status', { status: newStatus })
                    .then(function (result) {
                        if (result.success) {
                            loadOrders();
                        } else {
                            alert('Failed to update status: ' + (result.error ? result.error.message : 'Unknown error'));
                        }
                    })
                    .catch(function (err) { console.error(err); });
            }

            function viewOrder(id) {
                window.CloudyBreezeAdmin.apiGet('/api/orders/admin/' + id)
                    .then(function (result) {
                        if (!result.success) return;
                        var order = result.data;
                        var html = '<div class="order-detail-grid">' +
                            '<div><strong>Order Number:</strong> ' + order.order_number + '</div>' +
                            '<div><strong>Date:</strong> ' + formatDateTime(order.created_at) + '</div>' +
                            '<div><strong>Status:</strong> <span class="admin-badge badge-' + order.status + '">' + order.status + '</span></div>' +
                            '<div><strong>Payment:</strong> ' + order.payment_method + ' - <span class="admin-badge badge-' + order.payment_status + '">' + order.payment_status + '</span></div>' +
                            '<div><strong>Customer:</strong> ' + order.customer_name + ' (' + order.customer_email + ')</div>' +
                            '<div><strong>Phone:</strong> ' + (order.customer_phone || '-') + '</div>' +
                            '<div><strong>Address:</strong> ' + order.shipping_address + ', ' + order.shipping_city + ', ' + order.shipping_country + '</div>' +
                            '<div><strong>Notes:</strong> ' + (order.notes || '-') + '</div>' +
                            '</div>' +
                            '<h4 style="margin-top:16px;">Items</h4>' +
                            '<table class="admin-table"><thead><tr><th>Product</th><th>Variant</th><th>Price</th><th>Qty</th><th>Total</th></tr></thead><tbody>' +
                            (order.items || []).map(function (item) {
                                return '<tr><td>' + item.product_name + '</td><td>' + (item.variant_name || '-') + '</td><td>$' + parseFloat(item.unit_price).toFixed(2) + '</td><td>' + item.quantity + '</td><td>$' + parseFloat(item.line_total).toFixed(2) + '</td></tr>';
                            }).join('') +
                            '</tbody></table>' +
                            '<div style="text-align:right;margin-top:12px;"><strong>Subtotal:</strong> $' + parseFloat(order.subtotal).toFixed(2) + '<br><strong>Shipping:</strong> $' + parseFloat(order.shipping_cost).toFixed(2) + '<br><strong>Total:</strong> $' + parseFloat(order.total).toFixed(2) + '</div>';

                        document.getElementById('orderDetailContent').innerHTML = html;
                        document.getElementById('orderModal').style.display = 'flex';
                    });
            }

            function renderPagination(pagination) {
                var container = document.getElementById('ordersPagination');
                if (!pagination || pagination.pages <= 1) { container.innerHTML = ''; return; }
                var html = '';
                for (var i = 1; i <= pagination.pages; i++) {
                    html += '<button class="pagination-btn' + (i === pagination.page ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
                }
                container.innerHTML = html;
                container.querySelectorAll('.pagination-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        currentPage = parseInt(this.getAttribute('data-page'));
                        loadOrders();
                    });
                });
            }

            function initFilters() {
                var timer;
                document.getElementById('statusFilter').addEventListener('change', function () {
                    statusFilter = this.value;
                    currentPage = 1;
                    loadOrders();
                });
                document.getElementById('paymentFilter').addEventListener('change', function () {
                    paymentFilter = this.value;
                    currentPage = 1;
                    loadOrders();
                });
                document.getElementById('orderSearch').addEventListener('input', function () {
                    clearTimeout(timer);
                    timer = setTimeout(function () {
                        searchTerm = document.getElementById('orderSearch').value.trim();
                        currentPage = 1;
                        loadOrders();
                    }, 400);
                });
            }

            function initOrderModal() {
                document.getElementById('closeOrderModal').addEventListener('click', function () {
                    document.getElementById('orderModal').style.display = 'none';
                });
                document.querySelector('#orderModal .admin-modal-overlay').addEventListener('click', function () {
                    document.getElementById('orderModal').style.display = 'none';
                });
            }

            function formatDate(dateString) {
                var d = new Date(dateString);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            function formatDateTime(dateString) {
                var d = new Date(dateString);
                return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            }

            function setAdminUserName() {
                var user = window.CloudyBreezeAdmin.getUser();
                var el = document.getElementById('adminUserName');
                if (el && user) el.textContent = user.fullName || user.email;
            }
            function initSidebar() {
                var toggle = document.getElementById('sidebarToggle');
                var sidebar = document.getElementById('adminSidebar');
                if (toggle && sidebar) toggle.addEventListener('click', function () { sidebar.classList.toggle('open'); });
            }
            function initLogout() {
                var btn = document.getElementById('logoutBtn');
                if (btn) btn.addEventListener('click', function () { window.CloudyBreezeAdmin.logout(); });
            }
        })();
    </script>
</body>
</html>
