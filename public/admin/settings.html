<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Settings - CloudyBreeze Admin</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a href="/admin/dashboard.html" class="admin-sidebar-logo">
                <img src="../images/logo.png" alt="CloudyBreeze Logo">
            </a>
            <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
        </div>
        <nav class="admin-nav">
            <ul class="admin-nav-list">
                <li><a href="/admin/dashboard.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dashboard</a></li>
                <li><a href="/admin/products.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Products</a></li>
                <li><a href="/admin/categories.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Categories</a></li>
                <li><a href="/admin/orders.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>Orders</a></li>
                <li><a href="/admin/analytics.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a></li>
                <li><a href="/admin/settings.html" class="admin-nav-link active"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</a></li>
            </ul>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-link" target="_blank"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>View Store</a>
            <button class="admin-nav-link" id="logoutBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <h1 class="admin-page-title">Store Settings</h1>
            </div>
            <div class="admin-topbar-right">
                <span class="admin-user-name" id="adminUserName">Admin</span>
            </div>
        </header>

        <div class="admin-content">
            <form class="admin-form" id="settingsForm" novalidate>
                <!-- Store Information -->
                <div class="admin-card">
                    <div class="admin-card-header"><h2 class="admin-card-title">Store Information</h2></div>
                    <div class="admin-card-body">
                        <div class="form-row form-row-2col">
                            <div class="form-group">
                                <label for="storeName" class="form-label">Store Name</label>
                                <input type="text" id="storeName" name="store_name" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="storeEmail" class="form-label">Email Address</label>
                                <input type="email" id="storeEmail" name="email" class="form-input">
                            </div>
                        </div>
                        <div class="form-row form-row-2col">
                            <div class="form-group">
                                <label for="storePhone" class="form-label">Phone</label>
                                <input type="text" id="storePhone" name="phone" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="storeCurrency" class="form-label">Currency</label>
                                <select id="storeCurrency" name="currency" class="form-select">
                                    <option value="USD">USD - US Dollar</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="GBP">GBP - British Pound</option>
                                    <option value="CAD">CAD - Canadian Dollar</option>
                                    <option value="AUD">AUD - Australian Dollar</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="storeAddress" class="form-label">Address</label>
                            <textarea id="storeAddress" name="address" class="form-textarea" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Shipping Settings -->
                <div class="admin-card">
                    <div class="admin-card-header"><h2 class="admin-card-title">Shipping</h2></div>
                    <div class="admin-card-body">
                        <div class="form-row form-row-2col">
                            <div class="form-group">
                                <label for="shippingCost" class="form-label">Shipping Cost ($)</label>
                                <input type="number" id="shippingCost" name="shipping_cost" class="form-input" step="0.01" min="0">
                            </div>
                            <div class="form-group">
                                <label for="freeShippingThreshold" class="form-label">Free Shipping Threshold ($)</label>
                                <input type="number" id="freeShippingThreshold" name="free_shipping_threshold" class="form-input" step="0.01" min="0" placeholder="Leave empty for no free shipping">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="admin-card">
                    <div class="admin-card-header"><h2 class="admin-card-title">Social Links</h2></div>
                    <div class="admin-card-body">
                        <div class="form-row form-row-2col">
                            <div class="form-group">
                                <label for="facebookUrl" class="form-label">Facebook URL</label>
                                <input type="url" id="facebookUrl" name="facebook" class="form-input" placeholder="https://facebook.com/...">
                            </div>
                            <div class="form-group">
                                <label for="instagramUrl" class="form-label">Instagram URL</label>
                                <input type="url" id="instagramUrl" name="instagram" class="form-input" placeholder="https://instagram.com/...">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="twitterUrl" class="form-label">Twitter URL</label>
                            <input type="url" id="twitterUrl" name="twitter" class="form-input" placeholder="https://twitter.com/...">
                        </div>
                    </div>
                </div>

                <!-- SEO Settings -->
                <div class="admin-card">
                    <div class="admin-card-header"><h2 class="admin-card-title">SEO</h2></div>
                    <div class="admin-card-body">
                        <div class="form-group">
                            <label for="seoTitle" class="form-label">SEO Title</label>
                            <input type="text" id="seoTitle" name="seo_title" class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="seoDescription" class="form-label">SEO Description</label>
                            <textarea id="seoDescription" name="seo_description" class="form-textarea" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="admin-form-actions">
                    <div class="form-message success" id="settingsMessage" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary btn-lg" id="saveBtn">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        (function () {
            'use strict';

            if (!window.CloudyBreezeAdmin || !window.CloudyBreezeAdmin.checkAuth()) {
                window.location.href = '/admin/login.html';
                return;
            }

            document.addEventListener('DOMContentLoaded', function () {
                setAdminUserName();
                loadSettings();
                initSidebar();
                initLogout();
                initForm();
            });

            function loadSettings() {
                window.CloudyBreezeAdmin.apiGet('/api/settings/admin')
                    .then(function (result) {
                        if (!result.success || !result.data) return;
                        var s = result.data;
                        document.getElementById('storeName').value = s.store_name || '';
                        document.getElementById('storeEmail').value = s.email || '';
                        document.getElementById('storePhone').value = s.phone || '';
                        document.getElementById('storeAddress').value = s.address || '';
                        document.getElementById('storeCurrency').value = s.currency || 'USD';
                        document.getElementById('shippingCost').value = s.shipping_cost || '';
                        document.getElementById('freeShippingThreshold').value = s.free_shipping_threshold || '';
                        document.getElementById('facebookUrl').value = s.facebook || '';
                        document.getElementById('instagramUrl').value = s.instagram || '';
                        document.getElementById('twitterUrl').value = s.twitter || '';
                        document.getElementById('seoTitle').value = s.seo_title || '';
                        document.getElementById('seoDescription').value = s.seo_description || '';
                    })
                    .catch(function (err) { console.error(err); });
            }

            function initForm() {
                var form = document.getElementById('settingsForm');
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    saveSettings();
                });
            }

            function saveSettings() {
                var data = {
                    store_name: document.getElementById('storeName').value.trim(),
                    email: document.getElementById('storeEmail').value.trim(),
                    phone: document.getElementById('storePhone').value.trim() || null,
                    address: document.getElementById('storeAddress').value.trim() || null,
                    currency: document.getElementById('storeCurrency').value,
                    shipping_cost: parseFloat(document.getElementById('shippingCost').value) || 0,
                    free_shipping_threshold: parseFloat(document.getElementById('freeShippingThreshold').value) || null,
                    facebook: document.getElementById('facebookUrl').value.trim() || null,
                    instagram: document.getElementById('instagramUrl').value.trim() || null,
                    twitter: document.getElementById('twitterUrl').value.trim() || null,
                    seo_title: document.getElementById('seoTitle').value.trim(),
                    seo_description: document.getElementById('seoDescription').value.trim(),
                };

                var btn = document.getElementById('saveBtn');
                btn.disabled = true;
                btn.textContent = 'Saving...';

                window.CloudyBreezeAdmin.apiPut('/api/settings/admin', data)
                    .then(function (result) {
                        btn.disabled = false;
                        btn.textContent = 'Save Settings';
                        if (!result.success) {
                            showMessage(result.error ? result.error.message : 'Failed to save settings.', 'error');
                            return;
                        }
                        showMessage('Settings saved successfully!', 'success');
                    })
                    .catch(function () {
                        btn.disabled = false;
                        btn.textContent = 'Save Settings';
                        showMessage('Network error. Please try again.', 'error');
                    });
            }

            function showMessage(msg, type) {
                var el = document.getElementById('settingsMessage');
                el.textContent = msg;
                el.className = 'form-message ' + type;
                el.style.display = 'block';
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(function () {
                    el.style.display = 'none';
                }, 4000);
            }

            function setAdminUserName() {
                var user = window.CloudyBreezeAdmin.getUser();
                var el = document.getElementById('adminUserName');
                if (el && user) el.textContent = user.fullName || user.email;
            }
            function initSidebar() {
                var toggle = document.getElementById('sidebarToggle');
                var sidebar = document.getElementById('adminSidebar');
                if (toggle && sidebar) toggle.addEventListener('click', function () { sidebar.classList.toggle('open'); });
            }
            function initLogout() {
                var btn = document.getElementById('logoutBtn');
                if (btn) btn.addEventListener('click', function () { window.CloudyBreezeAdmin.logout(); });
            }
        })();
    </script>
</body>
</html>
