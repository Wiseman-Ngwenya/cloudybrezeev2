<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Messages - CloudyBreeze Admin</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .messages-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .messages-layout {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .messages-list {
            max-height: calc(100vh - 240px);
            overflow: auto;
            border-radius: 16px;
            border: 1px solid var(--color-light-gray);
            background: #fff;
        }

        .message-item {
            width: 100%;
            text-align: left;
            border: 0;
            border-bottom: 1px solid var(--color-light-gray);
            background: transparent;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 160ms ease;
        }

        .message-item:hover,
        .message-item.active {
            background: rgba(44, 122, 123, 0.06);
        }

        .message-item-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .message-item-name {
            font-weight: 700;
            color: var(--color-text);
        }

        .message-item-date,
        .message-item-email,
        .message-item-subject {
            color: var(--color-text-light);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message-preview {
            color: var(--color-dark-gray);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .message-detail-empty {
            border: 1px dashed var(--color-light-gray);
            border-radius: 18px;
            background: rgba(44, 122, 123, 0.03);
            padding: 40px 24px;
            text-align: center;
            color: var(--color-text-light);
        }

        .message-detail-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .message-detail-title {
            margin: 0;
            font-size: 1.4rem;
        }

        .message-detail-meta {
            display: grid;
            gap: 8px;
            margin-bottom: 20px;
        }

        .message-meta-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: baseline;
        }

        .message-meta-label {
            min-width: 90px;
            font-weight: 700;
            color: var(--color-dark-gray);
        }

        .message-meta-value,
        .message-message-body {
            color: var(--color-text);
        }

        .message-message-body {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 0.98rem;
        }

        .message-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .admin-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(44, 122, 123, 0.08);
            color: var(--color-primary);
            font-weight: 700;
            font-size: 0.88rem;
        }

        .admin-pill.secondary {
            background: rgba(0, 0, 0, 0.05);
            color: var(--color-dark-gray);
        }

        @media (max-width: 1080px) {
            .messages-layout {
                grid-template-columns: 1fr;
            }

            .messages-list {
                max-height: 420px;
            }
        }
    </style>
</head>

        </div>
        <nav class="admin-nav">

                <li><a href="/admin/products.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Products</a></li>
                <li><a href="/admin/categories.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Categories</a></li>

                <li><a href="/admin/analytics.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a></li>

        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-link" target="_blank"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>View Store</a>
            <button class="admin-nav-link" id="logoutBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</button>
        </div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <h1 class="admin-page-title">Contact Messages</h1>
            </div>
            <div class="admin-topbar-right">
                <span class="admin-user-name" id="adminUserName">Admin</span>
            </div>
        </header>

        <div class="admin-content">
            <div class="admin-card">
                <div class="messages-toolbar">
                    <div>
                        <h2 class="admin-card-title" style="margin-bottom:6px;">Inbox</h2>
                        <p class="text-muted" style="margin:0;">Messages from the contact form stored in <strong>contact_messages</strong>.</p>
                    </div>
                    <div style="min-width:280px;flex:1;max-width:420px;">
                        <input type="search" id="messageSearch" class="form-input" placeholder="Search by name, email, or subject">
                    </div>
                </div>

                <div class="messages-layout">
                    <div>
                        <div class="messages-list" id="messagesList">
                            <div style="padding:18px;" class="text-muted">Loading messages...</div>
                        </div>
                    </div>

                    <div>
                        <div class="admin-card" style="margin:0;">
                            <div class="admin-card-body" id="messageDetailContainer">
                                <div class="message-detail-empty">
                                    <h3 style="margin-top:0;">Select a message</h3>
                                    <p style="margin-bottom:0;">Pick a message on the left to view the full details.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        (function () {
            'use strict';

            var allMessages = [];
            var filteredMessages = [];
            var selectedMessage = null;

            if (!window.CloudyBreezeAdmin || !window.CloudyBreezeAdmin.checkAuth()) {
                window.location.href = '/admin/login.html';
                return;
            }

            document.addEventListener('DOMContentLoaded', function () {
                setAdminUserName();
                initSidebar();
                initLogout();
                initSearch();
                loadMessages();
            });

            function loadMessages() {
                window.CloudyBreezeAdmin.apiGet('/api/admin/contacts?limit=100')
                    .then(function (result) {
                        if (!result.success) {
                            throw new Error('Failed to load messages');
                        }

                        allMessages = result.data || [];
                        filteredMessages = allMessages.slice();
                        renderMessagesList();

                        if (allMessages.length > 0) {
                            selectMessage(allMessages[0].id);
                        }
                    })
                    .catch(function (err) {
                        console.error(err);
                        document.getElementById('messagesList').innerHTML = '<div style="padding:18px;" class="text-muted">Unable to load messages.</div>';
                    });
            }

            function initSearch() {
                var input = document.getElementById('messageSearch');
                input.addEventListener('input', function () {
                    var term = this.value.trim().toLowerCase();
                    filteredMessages = allMessages.filter(function (msg) {
                        var haystack = [msg.name, msg.email, msg.subject, msg.message]
                            .filter(Boolean)
                            .join(' ')
                            .toLowerCase();
                        return haystack.indexOf(term) !== -1;
                    });
                    renderMessagesList();
                });
            }

            function renderMessagesList() {
                var list = document.getElementById('messagesList');

                if (filteredMessages.length === 0) {
                    list.innerHTML = '<div style="padding:18px;" class="text-muted">No messages found.</div>';
                    document.getElementById('messageDetailContainer').innerHTML = '<div class="message-detail-empty"><h3 style="margin-top:0;">No match</h3><p style="margin-bottom:0;">Try a different search term.</p></div>';
                    return;
                }

                list.innerHTML = filteredMessages.map(function (msg) {
                    var preview = (msg.message || '').replace(/\s+/g, ' ').slice(0, 110);
                    return '<button class="message-item' + (selectedMessage && selectedMessage.id === msg.id ? ' active' : '') + '" data-id="' + msg.id + '">' +
                        '<div class="message-item-top">' +
                            '<span class="message-item-name">' + escapeHtml(msg.name) + '</span>' +
                            '<span class="message-item-date">' + formatDate(msg.created_at) + '</span>' +
                        '</div>' +
                        '<div class="message-item-email">' + escapeHtml(msg.email) + '</div>' +
                        '<div class="message-item-subject">' + escapeHtml(msg.subject || 'No subject') + '</div>' +
                        '<div class="message-preview">' + escapeHtml(preview) + '</div>' +
                    '</button>';
                }).join('');

                list.querySelectorAll('.message-item').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        selectMessage(this.getAttribute('data-id'));
                    });
                });
            }

            function selectMessage(id) {
                var msg = allMessages.find(function (m) { return m.id === id; });
                if (!msg) return;
                selectedMessage = msg;
                renderMessagesList();
                renderMessageDetail(msg);
            }

            function renderMessageDetail(msg) {
                var container = document.getElementById('messageDetailContainer');
                var replyEmail = 'mailto:' + encodeURIComponent(msg.email) + '?subject=' + encodeURIComponent('Re: ' + (msg.subject || 'Your message'));

                container.innerHTML =
                    '<div class="message-detail-header">' +
                        '<div>' +
                            '<h2 class="message-detail-title">' + escapeHtml(msg.subject || 'No subject') + '</h2>' +
                            '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
                                '<span class="admin-pill">' + escapeHtml(msg.name) + '</span>' +
                                '<span class="admin-pill secondary">' + formatDate(msg.created_at) + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="message-detail-meta">' +
                        '<div class="message-meta-row"><span class="message-meta-label">Email</span><span class="message-meta-value">' + escapeHtml(msg.email) + '</span></div>' +
                        '<div class="message-meta-row"><span class="message-meta-label">Subject</span><span class="message-meta-value">' + escapeHtml(msg.subject || '—') + '</span></div>' +
                        '<div class="message-meta-row"><span class="message-meta-label">Sent</span><span class="message-meta-value">' + formatDate(msg.created_at) + '</span></div>' +
                    '</div>' +
                    '<div class="message-message-body">' + escapeHtml(msg.message) + '</div>' +
                    '<div class="message-actions">' +
                        '<a class="btn btn-primary" href="' + replyEmail + '">Reply</a>' +
                        '<button class="btn btn-outline" id="deleteMessageBtn">Delete</button>' +
                    '</div>';

                document.getElementById('deleteMessageBtn').addEventListener('click', function () {
                    if (!confirm('Delete this message? This cannot be undone.')) return;
                    window.CloudyBreezeAdmin.apiDelete('/api/admin/contacts/' + msg.id)
                        .then(function (result) {
                            if (!result.success) {
                                throw new Error('Delete failed');
                            }
                            loadMessages();
                        })
                        .catch(function (err) {
                            console.error(err);
                            alert('Could not delete the message.');
                        });
                });
            }

            function escapeHtml(str) {
                return String(str || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function formatDate(dateString) {
                try {
                    return new Date(dateString).toLocaleString();
                } catch (err) {
                    return dateString || '';
                }
            }

            function setAdminUserName() {
                var user = window.CloudyBreezeAdmin.getUser();
                var el = document.getElementById('adminUserName');
                if (el && user) {
                    el.textContent = user.fullName || user.email || 'Admin';
                }
            }

            function initSidebar() {
                var toggle = document.getElementById('sidebarToggle');
                var sidebar = document.getElementById('adminSidebar');
                if (toggle && sidebar) {
                    toggle.addEventListener('click', function () {
                        sidebar.classList.toggle('open');
                    });
                }
            }

            function initLogout() {
                var btn = document.getElementById('logoutBtn');
                if (btn) {
                    btn.addEventListener('click', function () {
                        window.CloudyBreezeAdmin.logout();
                    });
                }
            }
        })();
    </script>
</body>
