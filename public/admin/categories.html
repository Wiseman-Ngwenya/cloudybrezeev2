<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Categories - CloudyBreeze Admin</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a href="/admin/dashboard.html" class="admin-sidebar-logo">
                <img src="../images/logo.png" alt="CloudyBreeze Logo">
            </a>
            <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
        </div>
        <nav class="admin-nav">
            <ul class="admin-nav-list">
                <li><a href="/admin/dashboard.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dashboard</a></li>
                <li><a href="/admin/products.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Products</a></li>
                <li><a href="/admin/categories.html" class="admin-nav-link active"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Categories</a></li>
                <li><a href="/admin/orders.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>Orders</a></li>
                <li><a href="/admin/analytics.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a></li>
                <li><a href="/admin/settings.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</a></li>
            </ul>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-link" target="_blank"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>View Store</a>
            <button class="admin-nav-link" id="logoutBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <h1 class="admin-page-title">Categories</h1>
            </div>
            <div class="admin-topbar-right">
                <button class="btn btn-primary btn-sm" id="addCategoryBtn">+ Add Category</button>
                <span class="admin-user-name" id="adminUserName">Admin</span>
            </div>
        </header>

        <div class="admin-content">
            <!-- Categories Table -->
            <div class="admin-card">
                <div class="admin-card-body">
                    <div class="admin-table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Slug</th>
                                    <th>Sort Order</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesTable">
                                <tr><td colspan="5" class="admin-table-empty">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Form Modal -->
    <div class="admin-modal" id="categoryModal" style="display: none;">
        <div class="admin-modal-overlay"></div>
        <div class="admin-modal-content">
            <h3 class="admin-modal-title" id="categoryModalTitle">Add Category</h3>
            <form id="categoryForm" novalidate>
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label for="categoryName" class="form-label">Name *</label>
                    <input type="text" id="categoryName" name="name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="categorySlug" class="form-label">Slug</label>
                    <input type="text" id="categorySlug" name="slug" class="form-input" placeholder="Auto-generated if left empty">
                </div>
                <div class="form-group">
                    <label for="categoryDesc" class="form-label">Description</label>
                    <textarea id="categoryDesc" name="description" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="categoryImage" class="form-label">Image</label>
                    <input type="file" id="categoryImage" accept="image/jpeg,image/png,image/webp" class="form-input">
                    <input type="hidden" id="categoryImageUrl" name="image_url">
                    <button type="button" class="btn btn-sm btn-outline" id="uploadCategoryImageBtn" style="margin-top:8px;">Upload Image</button>
                    <span class="admin-upload-status" id="categoryUploadStatus"></span>
                    <div class="admin-image-preview" id="categoryImagePreview" style="margin-top:8px;"></div>
                </div>
                <div class="form-row form-row-2col">
                    <div class="form-group">
                        <label for="categorySortOrder" class="form-label">Sort Order</label>
                        <input type="number" id="categorySortOrder" name="sort_order" class="form-input" value="0" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Active</label>
                        <label class="admin-checkbox">
                            <input type="checkbox" id="categoryActive" name="active" checked> Active
                        </label>
                    </div>
                </div>
                <div class="form-message error" id="categoryFormMessage" style="display: none;"></div>
                <div class="admin-modal-actions">
                    <button type="button" class="btn btn-outline" id="cancelCategoryBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveCategoryBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="admin-modal" id="deleteModal" style="display: none;">
        <div class="admin-modal-overlay"></div>
        <div class="admin-modal-content">
            <h3 class="admin-modal-title">Delete Category</h3>
            <p>Are you sure you want to delete this category? Products in this category will be uncategorized.</p>
            <div class="admin-modal-actions">
                <button class="btn btn-outline" id="cancelDelete">Cancel</button>
                <button class="btn btn-primary" id="confirmDelete" style="background-color: var(--color-error); border-color: var(--color-error);">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        (function () {
            'use strict';

            if (!window.CloudyBreezeAdmin || !window.CloudyBreezeAdmin.checkAuth()) {
                window.location.href = '/admin/login.html';
                return;
            }

            var deleteCategoryId = null;

            document.addEventListener('DOMContentLoaded', function () {
                setAdminUserName();
                loadCategories();
                initSidebar();
                initLogout();
                initAddButton();
                initCategoryForm();
                initDeleteModal();
                initImageUpload();
            });

            function loadCategories() {
                window.CloudyBreezeAdmin.apiGet('/api/categories/admin')
                    .then(function (result) {
                        if (!result.success) return;
                        renderCategories(result.data || []);
                    })
                    .catch(function (err) { console.error(err); });
            }

            function renderCategories(categories) {
                var tbody = document.getElementById('categoriesTable');
                if (categories.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="admin-table-empty">No categories yet. Click "Add Category" to create one.</td></tr>';
                    return;
                }
                tbody.innerHTML = categories.map(function (cat) {
                    return '<tr>' +
                        '<td><strong>' + cat.name + '</strong></td>' +
                        '<td>' + (cat.slug || '-') + '</td>' +
                        '<td>' + cat.sort_order + '</td>' +
                        '<td><span class="admin-badge ' + (cat.active ? 'badge-success' : 'badge-error') + '">' + (cat.active ? 'Active' : 'Inactive') + '</span></td>' +
                        '<td><div class="admin-actions">' +
                            '<button class="btn btn-sm btn-outline edit-cat-btn" data-id="' + cat.id + '">Edit</button>' +
                            '<button class="btn btn-sm btn-outline delete-cat-btn" data-id="' + cat.id + '" style="color:var(--color-error);border-color:var(--color-error);">Delete</button>' +
                        '</div></td>' +
                    '</tr>';
                }).join('');

                attachRowEvents();
            }

            function attachRowEvents() {
                document.querySelectorAll('.edit-cat-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = this.getAttribute('data-id');
                        editCategory(id);
                    });
                });
                document.querySelectorAll('.delete-cat-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        deleteCategoryId = this.getAttribute('data-id');
                        document.getElementById('deleteModal').style.display = 'flex';
                    });
                });
            }

            function editCategory(id) {
                window.CloudyBreezeAdmin.apiGet('/api/categories/admin/' + id)
                    .then(function (result) {
                        if (!result.success) return;
                        var cat = result.data;
                        document.getElementById('categoryId').value = cat.id;
                        document.getElementById('categoryName').value = cat.name;
                        document.getElementById('categorySlug').value = cat.slug || '';
                        document.getElementById('categoryDesc').value = cat.description || '';
                        document.getElementById('categorySortOrder').value = cat.sort_order || 0;
                        document.getElementById('categoryActive').checked = cat.active;
                        document.getElementById('categoryImageUrl').value = cat.image_url || '';
                        if (cat.image_url) {
                            document.getElementById('categoryImagePreview').innerHTML = '<img src="' + cat.image_url + '" alt="Category image">';
                        } else {
                            document.getElementById('categoryImagePreview').innerHTML = '';
                        }
                        document.getElementById('categoryModalTitle').textContent = 'Edit Category';
                        document.getElementById('categoryModal').style.display = 'flex';
                    });
            }

            function initAddButton() {
                document.getElementById('addCategoryBtn').addEventListener('click', function () {
                    document.getElementById('categoryForm').reset();
                    document.getElementById('categoryId').value = '';
                    document.getElementById('categoryImageUrl').value = '';
                    document.getElementById('categoryImagePreview').innerHTML = '';
                    document.getElementById('categoryModalTitle').textContent = 'Add Category';
                    document.getElementById('categoryFormMessage').style.display = 'none';
                    document.getElementById('categoryModal').style.display = 'flex';
                });
            }

            function initCategoryForm() {
                document.getElementById('cancelCategoryBtn').addEventListener('click', function () {
                    document.getElementById('categoryModal').style.display = 'none';
                });
                document.getElementById('categoryForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    saveCategory();
                });
            }

            function saveCategory() {
                var id = document.getElementById('categoryId').value;
                var data = {
                    name: document.getElementById('categoryName').value.trim(),
                    slug: document.getElementById('categorySlug').value.trim() || undefined,
                    description: document.getElementById('categoryDesc').value.trim() || null,
                    image_url: document.getElementById('categoryImageUrl').value || null,
                    sort_order: parseInt(document.getElementById('categorySortOrder').value) || 0,
                    active: document.getElementById('categoryActive').checked,
                };

                if (!data.name) {
                    showCategoryMessage('Category name is required.', 'error');
                    return;
                }

                var url = id ? '/api/categories/admin/' + id : '/api/categories/admin';
                var method = id ? 'PUT' : 'POST';
                var btn = document.getElementById('saveCategoryBtn');
                btn.disabled = true; btn.textContent = 'Saving...';

                window.CloudyBreezeAdmin.apiRequest(url, method, data)
                    .then(function (result) {
                        btn.disabled = false; btn.textContent = 'Save';
                        if (!result.success) {
                            showCategoryMessage(result.error ? result.error.message : 'Failed to save.', 'error');
                            return;
                        }
                        document.getElementById('categoryModal').style.display = 'none';
                        loadCategories();
                    })
                    .catch(function () {
                        btn.disabled = false; btn.textContent = 'Save';
                        showCategoryMessage('Network error.', 'error');
                    });
            }

            function showCategoryMessage(msg, type) {
                var el = document.getElementById('categoryFormMessage');
                el.textContent = msg;
                el.className = 'form-message ' + type;
                el.style.display = 'block';
            }

            function initImageUpload() {
                document.getElementById('uploadCategoryImageBtn').addEventListener('click', function () {
                    var file = document.getElementById('categoryImage').files[0];
                    if (!file) return;
                    var statusEl = document.getElementById('categoryUploadStatus');
                    statusEl.textContent = 'Uploading...';
                    var formData = new FormData();
                    formData.append('image', file);
                    fetch('/api/admin/upload?folder=categories', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('cb_admin_token') },
                        body: formData,
                    })
                        .then(function (res) { return res.json(); })
                        .then(function (result) {
                            if (!result.success) { statusEl.textContent = result.error.message; return; }
                            document.getElementById('categoryImageUrl').value = result.data.url;
                            document.getElementById('categoryImagePreview').innerHTML = '<img src="' + result.data.url + '" alt="Category image">';
                            statusEl.textContent = 'Uploaded!';
                        })
                        .catch(function () { statusEl.textContent = 'Upload failed'; });
                });
            }

            function initDeleteModal() {
                document.getElementById('cancelDelete').addEventListener('click', function () {
                    document.getElementById('deleteModal').style.display = 'none';
                    deleteCategoryId = null;
                });
                document.getElementById('confirmDelete').addEventListener('click', function () {
                    if (deleteCategoryId) {
                        window.CloudyBreezeAdmin.apiDelete('/api/categories/admin/' + deleteCategoryId)
                            .then(function () {
                                document.getElementById('deleteModal').style.display = 'none';
                                deleteCategoryId = null;
                                loadCategories();
                            })
                            .catch(function (err) { console.error(err); });
                    }
                });
            }

            function setAdminUserName() {
                var user = window.CloudyBreezeAdmin.getUser();
                var el = document.getElementById('adminUserName');
                if (el && user) el.textContent = user.fullName || user.email;
            }
            function initSidebar() {
                var toggle = document.getElementById('sidebarToggle');
                var sidebar = document.getElementById('adminSidebar');
                if (toggle && sidebar) toggle.addEventListener('click', function () { sidebar.classList.toggle('open'); });
            }
            function initLogout() {
                var btn = document.getElementById('logoutBtn');
                if (btn) btn.addEventListener('click', function () { window.CloudyBreezeAdmin.logout(); });
            }
        })();
    </script>
</body>
</html>
