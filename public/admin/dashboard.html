<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard - CloudyBreeze Admin</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a href="/admin/dashboard.html" class="admin-sidebar-logo">
                <img src="../images/logo.png" alt="CloudyBreeze Logo">
            </a>
            <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
        </div>
        <nav class="admin-nav">
            <ul class="admin-nav-list">
                <li>
                    <a href="/admin/dashboard.html" class="admin-nav-link active">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="/admin/products.html" class="admin-nav-link">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        Products
                    </a>
                </li>
                <li>
                    <a href="/admin/categories.html" class="admin-nav-link">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        Categories
                    </a>
                </li>
                <li>
                    <a href="/admin/orders.html" class="admin-nav-link">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                        Orders
                    </a>
                </li>
                <li>
                    <a href="/admin/analytics.html" class="admin-nav-link">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                        Analytics
                    </a>
                </li>
                <li>
                    <a href="/admin/settings.html" class="admin-nav-link">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </li>
            </ul>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-link" target="_blank">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                View Store
            </a>
            <button class="admin-nav-link" id="logoutBtn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <h1 class="admin-page-title">Dashboard</h1>
            </div>
            <div class="admin-topbar-right">
                <span class="admin-user-name" id="adminUserName">Admin</span>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="admin-content">
            <!-- Stats Cards -->
            <div class="admin-stats-grid">
                <div class="admin-stat-card">
                    <div class="admin-stat-icon visitors">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div class="admin-stat-info">
                        <span class="admin-stat-label">Visitors Today</span>
                        <span class="admin-stat-value" id="statVisitorsToday">0</span>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-icon orders">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    </div>
                    <div class="admin-stat-info">
                        <span class="admin-stat-label">Orders Today</span>
                        <span class="admin-stat-value" id="statOrdersToday">0</span>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-icon revenue">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    </div>
                    <div class="admin-stat-info">
                        <span class="admin-stat-label">Revenue (Month)</span>
                        <span class="admin-stat-value" id="statRevenueMonth">$0.00</span>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-icon products">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                    </div>
                    <div class="admin-stat-info">
                        <span class="admin-stat-label">Total Orders</span>
                        <span class="admin-stat-value" id="statTotalOrders">0</span>
                    </div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Recent Orders</h2>
                    <a href="/admin/orders.html" class="btn btn-sm btn-outline">View All</a>
                </div>
                <div class="admin-card-body">
                    <div class="admin-table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order #</th>
                                    <th>Customer</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrdersTable">
                                <tr><td colspan="5" class="admin-table-empty">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        (function () {
            'use strict';

            if (!window.CloudyBreezeAdmin || !window.CloudyBreezeAdmin.checkAuth()) {
                window.location.href = '/admin/login.html';
                return;
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadOverview();
                setAdminUserName();
                initSidebar();
                initLogout();
            });

            function loadOverview() {
                window.CloudyBreezeAdmin.apiGet('/api/analytics/admin/overview')
                    .then(function (result) {
                        if (!result.success) return;
                        var data = result.data;

                        document.getElementById('statVisitorsToday').textContent = data.visitors.today;
                        document.getElementById('statOrdersToday').textContent = data.orders.today;
                        document.getElementById('statRevenueMonth').textContent = '$' + data.revenue.thisMonth.toFixed(2);
                        document.getElementById('statTotalOrders').textContent = data.orders.total;

                        renderRecentOrders(data.recentOrders);
                    })
                    .catch(function (err) {
                        console.error('Error loading overview:', err);
                    });
            }

            function renderRecentOrders(orders) {
                var tbody = document.getElementById('recentOrdersTable');
                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="admin-table-empty">No orders yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(function (order) {
                    var statusClass = 'badge-' + order.status;
                    return '<tr>' +
                        '<td><a href="/admin/orders.html?id=' + order.id + '">' + order.order_number + '</a></td>' +
                        '<td>' + order.customer_name + '</td>' +
                        '<td>$' + parseFloat(order.total).toFixed(2) + '</td>' +
                        '<td><span class="admin-badge ' + statusClass + '">' + order.status + '</span></td>' +
                        '<td>' + formatDate(order.created_at) + '</td>' +
                    '</tr>';
                }).join('');
            }

            function setAdminUserName() {
                var user = window.CloudyBreezeAdmin.getUser();
                var el = document.getElementById('adminUserName');
                if (el && user) el.textContent = user.fullName || user.email;
            }

            function initSidebar() {
                var toggle = document.getElementById('sidebarToggle');
                var sidebar = document.getElementById('adminSidebar');
                if (toggle && sidebar) {
                    toggle.addEventListener('click', function () {
                        sidebar.classList.toggle('open');
                    });
                }
            }

            function initLogout() {
                var btn = document.getElementById('logoutBtn');
                if (btn) {
                    btn.addEventListener('click', function () {
                        window.CloudyBreezeAdmin.logout();
                    });
                }
            }

            function formatDate(dateString) {
                var d = new Date(dateString);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
        })();
    </script>
</body>
</html>
