<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Products - CloudyBreeze Admin</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a href="/admin/dashboard.html" class="admin-sidebar-logo">
                <img src="../images/logo.png" alt="CloudyBreeze Logo">
            </a>
            <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
        </div>
        <nav class="admin-nav">
            <ul class="admin-nav-list">
                <li><a href="/admin/dashboard.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dashboard</a></li>
                <li><a href="/admin/products.html" class="admin-nav-link active"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Products</a></li>
                <li><a href="/admin/categories.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Categories</a></li>
                <li><a href="/admin/orders.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>Orders</a></li>
                <li><a href="/admin/analytics.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Analytics</a></li>
                <li><a href="/admin/settings.html" class="admin-nav-link"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</a></li>
            </ul>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-link" target="_blank"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>View Store</a>
            <button class="admin-nav-link" id="logoutBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <h1 class="admin-page-title">Products</h1>
            </div>
            <div class="admin-topbar-right">
                <a href="/admin/product-editor.html" class="btn btn-primary btn-sm">+ Add Product</a>
                <span class="admin-user-name" id="adminUserName">Admin</span>
            </div>
        </header>

        <div class="admin-content">
            <!-- Search & Filters -->
            <div class="admin-card admin-filters">
                <div class="admin-filters-row">
                    <input type="text" class="form-input admin-search" id="productSearch" placeholder="Search products...">
                </div>
            </div>

            <!-- Products Table -->
            <div class="admin-card">
                <div class="admin-card-body">
                    <div class="admin-table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Featured</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTable">
                                <tr><td colspan="6" class="admin-table-empty">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="admin-card-footer">
                    <div class="admin-pagination" id="productsPagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="admin-modal" id="deleteModal" style="display: none;">
        <div class="admin-modal-overlay"></div>
        <div class="admin-modal-content">
            <h3 class="admin-modal-title">Delete Product</h3>
            <p>Are you sure you want to delete this product? This action cannot be undone.</p>
            <div class="admin-modal-actions">
                <button class="btn btn-outline" id="cancelDelete">Cancel</button>
                <button class="btn btn-primary" id="confirmDelete" style="background-color: var(--color-error); border-color: var(--color-error);">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        (function () {
            'use strict';

            if (!window.CloudyBreezeAdmin || !window.CloudyBreezeAdmin.checkAuth()) {
                window.location.href = '/admin/login.html';
                return;
            }

            var currentPage = 1;
            var searchTerm = '';
            var deleteProductId = null;

            document.addEventListener('DOMContentLoaded', function () {
                setAdminUserName();
                loadProducts();
                initSearch();
                initSidebar();
                initLogout();
                initDeleteModal();
            });

            function loadProducts() {
                var params = '?page=' + currentPage + '&limit=20';
                if (searchTerm) params += '&search=' + encodeURIComponent(searchTerm);

                window.CloudyBreezeAdmin.apiGet('/api/products/admin' + params)
                    .then(function (result) {
                        if (!result.success) return;
                        renderProducts(result.data, result.pagination);
                    })
                    .catch(function (err) {
                        console.error('Error loading products:', err);
                    });
            }

            function renderProducts(products, pagination) {
                var tbody = document.getElementById('productsTable');
                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="admin-table-empty">No products found.</td></tr>';
                    document.getElementById('productsPagination').innerHTML = '';
                    return;
                }

                tbody.innerHTML = products.map(function (p) {
                    var coverImg = p.cover_image ? '<img src="' + p.cover_image + '" alt="' + p.name + '" class="admin-product-thumb">' : '<div class="admin-product-thumb-placeholder"></div>';
                    return '<tr>' +
                        '<td><div class="admin-product-cell">' + coverImg + '<div><strong>' + p.name + '</strong><br><small class="text-muted">' + (p.slug || '') + '</small></div></div></td>' +
                        '<td>' + (p.category ? p.category.name : '-') + '</td>' +
                        '<td>$' + parseFloat(p.price).toFixed(2) + '</td>' +
                        '<td>' + (p.featured ? '<span class="admin-badge badge-success">Yes</span>' : '<span class="admin-badge">No</span>') + '</td>' +
                        '<td><span class="admin-badge ' + (p.active ? 'badge-success' : 'badge-error') + '">' + (p.active ? 'Active' : 'Inactive') + '</span></td>' +
                        '<td><div class="admin-actions">' +
                            '<a href="/admin/product-editor.html?id=' + p.id + '" class="btn btn-sm btn-outline">Edit</a>' +
                            '<button class="btn btn-sm btn-outline toggle-btn" data-id="' + p.id + '" data-active="' + p.active + '">' + (p.active ? 'Deactivate' : 'Activate') + '</button>' +
                            '<button class="btn btn-sm btn-outline delete-btn" data-id="' + p.id + '" style="color:var(--color-error);border-color:var(--color-error);">Delete</button>' +
                        '</div></td>' +
                    '</tr>';
                }).join('');

                // Attach event handlers
                attachRowEvents();
                renderPagination(pagination);
            }

            function attachRowEvents() {
                document.querySelectorAll('.toggle-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = this.getAttribute('data-id');
                        window.CloudyBreezeAdmin.apiPatch('/api/products/admin/' + id + '/toggle')
                            .then(function () { loadProducts(); })
                            .catch(function (err) { console.error(err); });
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        deleteProductId = this.getAttribute('data-id');
                        document.getElementById('deleteModal').style.display = 'flex';
                    });
                });
            }

            function renderPagination(pagination) {
                var container = document.getElementById('productsPagination');
                if (!pagination || pagination.pages <= 1) { container.innerHTML = ''; return; }

                var html = '';
                for (var i = 1; i <= pagination.pages; i++) {
                    html += '<button class="pagination-btn' + (i === pagination.page ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
                }
                container.innerHTML = html;

                container.querySelectorAll('.pagination-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        currentPage = parseInt(this.getAttribute('data-page'));
                        loadProducts();
                    });
                });
            }

            function initSearch() {
                var input = document.getElementById('productSearch');
                if (!input) return;
                var timer;
                input.addEventListener('input', function () {
                    clearTimeout(timer);
                    timer = setTimeout(function () {
                        searchTerm = input.value.trim();
                        currentPage = 1;
                        loadProducts();
                    }, 400);
                });
            }

            function initDeleteModal() {
                document.getElementById('cancelDelete').addEventListener('click', function () {
                    document.getElementById('deleteModal').style.display = 'none';
                    deleteProductId = null;
                });
                document.getElementById('confirmDelete').addEventListener('click', function () {
                    if (deleteProductId) {
                        window.CloudyBreezeAdmin.apiDelete('/api/products/admin/' + deleteProductId)
                            .then(function () {
                                document.getElementById('deleteModal').style.display = 'none';
                                deleteProductId = null;
                                loadProducts();
                            })
                            .catch(function (err) { console.error(err); });
                    }
                });
            }

            function setAdminUserName() {
                var user = window.CloudyBreezeAdmin.getUser();
                var el = document.getElementById('adminUserName');
                if (el && user) el.textContent = user.fullName || user.email;
            }

            function initSidebar() {
                var toggle = document.getElementById('sidebarToggle');
                var sidebar = document.getElementById('adminSidebar');
                if (toggle && sidebar) {
                    toggle.addEventListener('click', function () { sidebar.classList.toggle('open'); });
                }
            }

            function initLogout() {
                var btn = document.getElementById('logoutBtn');
                if (btn) btn.addEventListener('click', function () { window.CloudyBreezeAdmin.logout(); });
            }
        })();
    </script>
</body>
</html>
