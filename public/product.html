<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product details - CloudyBreeze">
    <title>Product - CloudyBreeze</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

    <header class="site-header" id="siteHeader">
        <div class="container header-container">
            <a href="/" class="logo-link">
                <img src="/images/logo.png" alt="CloudyBreeze Logo" class="logo">
            </a>

            <nav class="main-nav" id="mainNav">
                <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-list" id="navList">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li><a href="/products" class="nav-link active">Products</a></li>
                    <li><a href="/about" class="nav-link">About</a></li>
                    <li><a href="/contact" class="nav-link">Contact</a></li>
                    <li><a href="/tracking" class="nav-link">Track Order</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="/checkout" class="cart-link" id="cartLink" aria-label="View cart">
                    <svg class="cart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="product-loading" id="productLoading">
            <div class="container">
                <div class="spinner"></div>
                <p>Loading product details...</p>
            </div>
        </section>

        <section class="product-error" id="productError" style="display:none;">
            <div class="container">
                <div class="error-content">
                    <h2>Product Not Found</h2>
                    <p id="productErrorMessage">The product you are looking for does not exist or has been removed.</p>
                    <a href="/products" class="btn btn-primary">Browse Products</a>
                </div>
            </div>
        </section>

        <section class="product-detail" id="productDetail" style="display:none;">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="/">Home</a>
                    <span class="breadcrumb-separator" id="breadcrumbCategorySep" style="display:none;">/</span>
                    <a href="/products" id="breadcrumbCategory" style="display:none;">Products</a>
                    <span class="breadcrumb-separator">/</span>
                    <span id="breadcrumbCurrent">Product</span>
                </nav>

                <div class="product-detail-grid">
                    <div class="product-gallery-wrap">
                        <div class="product-gallery-main">
                            <img id="galleryMainImage" alt="Product image">
                        </div>
                        <div class="product-gallery-thumbnails" id="galleryThumbnails"></div>
                    </div>

                    <div class="product-info">
                        <span class="product-category-tag" id="productCategoryTag"></span>
                        <h1 id="productName"></h1>

                        <div class="product-price-row">
                            <span class="product-price" id="productPrice"></span>
                            <span class="product-compare-price" id="productComparePrice"></span>
                            <span class="product-discount-badge" id="productDiscountBadge" style="display:none;"></span>
                        </div>

                        <p class="product-short-description" id="productShortDesc"></p>

                        <div class="product-variants" id="productVariants" style="display:none;">
                            <h3>Variants</h3>
                            <div class="variants-options" id="variantsOptions"></div>
                        </div>

                        <div class="quantity-selector" style="margin-top:16px;">
                            <button type="button" class="quantity-btn" id="quantityDecrease">-</button>
                            <input type="number" class="quantity-input" id="quantityInput" value="1" min="1" max="99">
                            <button type="button" class="quantity-btn" id="quantityIncrease">+</button>
                        </div>

                        <div class="product-actions" style="margin-top:18px;">
                            <button class="btn btn-primary" id="addToCartBtn">Add to Cart <span id="addToCartPrice"></span></button>
                            <button class="btn btn-outline" id="buyNowBtn">Buy Now</button>
                        </div>

                        <p class="cart-message" id="cartMessage" style="display:none;"></p>

                        <div class="product-meta" id="productMeta" style="margin-top:18px;"></div>
                    </div>
                </div>

                <section class="product-description" id="productDescription" style="display:none; margin-top:32px;">
                    <h2>Description</h2>
                    <div id="descriptionContent"></div>
                </section>
            </div>
        </section>

        <section class="related-section" id="relatedSection" style="display:none; margin-top:40px;">
            <div class="container">
                <h2>Related Products</h2>
                <div class="products-grid" id="relatedProducts"></div>
            </div>
        </section>
    </main>

    <script src="/js/site.js"></script>
    <script src="/js/product.js"></script>
</body>
</html>
