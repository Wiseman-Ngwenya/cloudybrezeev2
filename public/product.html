<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product details - CloudyBreeze">
    <title>Product - CloudyBreeze</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header" id="siteHeader">
        <div class="container header-container">
            <a href="/" class="logo-link">
                <img src="/images/logo.png" alt="CloudyBreeze Logo" class="logo">
            </a>
            <nav class="main-nav" id="mainNav">
                <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-list" id="navList">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li><a href="/products" class="nav-link active">Products</a></li>
                    <li><a href="/about" class="nav-link">About</a></li>
                    <li><a href="/contact" class="nav-link">Contact</a></li>
                    <li><a href="/tracking" class="nav-link">Track Order</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="/checkout" class="cart-link" id="cartLink" aria-label="View cart">
                    <svg class="cart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Loading State -->
        <section class="product-loading" id="productLoading">
            <div class="container">
                <div class="spinner"></div>
                <p>Loading product details...</p>
            </div>
        </section>

        <!-- Error / Not Found State -->
        <section class="product-error" id="productError" style="display: none;">
            <div class="container">
                <div class="error-content">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h2>Product Not Found</h2>
                    <p id="productErrorMessage">The product you are looking for does not exist or has been removed.</p>
                    <a href="/products" class="btn btn-primary">Browse Products</a>
                </div>
            </div>
        </section>

        <!-- Product Detail -->
        <section class="product-detail" id="productDetail" style="display: none;">
            <div class="container">
                <!-- Breadcrumb -->
                <nav class="breadcrumb" id="productBreadcrumb" aria-label="Breadcrumb">
                    <a href="/">Home</a>
                    <span class="breadcrumb-separator">/</span>
                    <a href="/products">Products</a>
                    <span class="breadcrumb-separator">/</span>
                    <span id="breadcrumbCurrent">Product</span>
                </nav>

                <div class="product-detail-grid">
                    <div class="product-gallery" id="productGallery"></div>
                    <div class="product-info">
                        <h1 id="productName"></h1>
                        <div class="product-meta" id="productMeta"></div>
                        <div class="product-price-row">
                            <span class="product-price" id="productPrice"></span>
                            <span class="product-compare-price" id="productComparePrice"></span>
                        </div>
                        <p class="product-short-description" id="productShortDescription"></p>
                        <div class="product-options" id="productOptions"></div>
                        <div class="product-actions">
                            <button class="btn btn-primary" id="addToCartBtn">Add to Cart</button>
                            <button class="btn btn-outline" id="buyNowBtn">Buy Now</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/product.js"></script>
</body>
</html>
